name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: pip install --no-deps -r constraints.txt
      - name: Run deterministic Agent evaluation gate
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python scripts/agent_evaluation_gate.py check
      - name: Run Agent evaluation sensitivity gate v2
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python scripts/agent_evaluation_v2_gate.py check
      - name: Run evidence-gated loop kernel
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python scripts/evidence_gated_loop_gate.py check
      - name: Run deterministic run creation idempotency proof
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python scripts/run_creation_idempotency_proof.py check
      - name: Run deterministic run dispatch reconciliation proof
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python scripts/run_dispatch_reconciliation_proof.py check
      - name: Run failure cause proof
        run: python scripts/run_failure_cause_proof.py check
      - name: Verify crash-safe rollback source identity
        env:
          ROLLBACK_REVISION: bfd744a5611c7673d9385a45bed0131d6cb47655
        run: |
          git cat-file -e "$ROLLBACK_REVISION^{commit}"
          git archive --format=tar "$ROLLBACK_REVISION" >/dev/null
      - name: Run crash-safe execution recovery proof
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python scripts/run_execution_recovery_proof.py check
      - name: Run secure local runtime proof
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python scripts/secure_local_runtime_proof.py check
      - name: Run bounded live producer contract check
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python scripts/bounded_live_producer_proof.py check
      - name: Run tests
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: python -m pytest -q -m "not docker"

  container:
    name: Secure Local Runtime Containers
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: pip install --no-deps -r constraints.txt
      - name: Run required container tests
        env:
          PYTHON_DOTENV_DISABLED: '1'
          DECISION_RESEARCH_AGENT_REQUIRE_DOCKER_TESTS: 'true'
        run: python -m pytest -q -m docker

  frontend:
    name: Frontend Demo Console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
